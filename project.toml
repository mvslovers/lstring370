[project]
name = "lstring370"
version = "1.0.0-dev"
type = "library"

[build]
# -Wall -Werror per the project's cardinal rules; verified clean under cc370.
cflags = ["-I", "include", "-Wall", "-Werror"]

# ── Static library ───────────────────────────────────────
# lstring370 is consumed as a single archive: rexx370, httpd, ftpd,
# ufsd and others declare it in [dependencies] and `make deps` stages
# build/lstring370.a + the headers below.  The C runtime (malloc/free,
# <string.h>, <ctype.h>) comes from the cc370 sysroot libc (-lc), so no
# crent370 dependency is needed here.
[lib]
name = "lstring370"
sources = ["src/lstr#*.c"]
headers = ["include/lstring.h", "include/lstralloc.h"]

# ── Release ──────────────────────────────────────────────
[release]
version_files = ["VERSION"]
