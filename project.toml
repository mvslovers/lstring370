[project]
name = "lstring370"
version = "1.0.0-dev"
type = "library"

[build]
# -Wall -Werror per the project's cardinal rules; verified clean under cc370.
cflags = ["-I", "include", "-Wall", "-Werror"]

# ── Static library ───────────────────────────────────────
# lstring370 is consumed as a single archive: rexx370, httpd, ftpd,
# ufsd and others declare it in [dependencies] and `make deps` stages
# build/lstring370.a + the headers below.  The C runtime (malloc/free,
# <string.h>, <ctype.h>) comes from the cc370 sysroot libc (-lc), so no
# crent370 dependency is needed here.
[lib]
name = "lstring370"
sources = ["src/lstr#*.c"]
headers = ["include/lstring.h", "include/lstralloc.h"]

# ── Release ──────────────────────────────────────────────
[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68). cc370 is omitted -- it defaults to main and has no
# releases to pin to yet. lstring370 includes only ISO C headers, whose
# names did not move in libc370 2.0, so the port is this pin alone.
libc370 = "2.0.0"

[release]
version_files = ["VERSION"]
