schema = 3

[project]
name = "lstring370"
version = "1.0.0-dev"
kind = "library"

[toolchain]
mbt = "3.0"
cc370 = "1.4.0"
libc370 = "2.4.1"

[build]

[lib]
name = "lstring370"
sources = ["src/lstr#*.c"]
headers = ["include/lstring.h", "include/lstralloc.h"]

[tests]
rent = false
reus = false

# A test is built from its own file only; this one exercises the whole
# library, so it links every source module.
[test.TSTLSTR]
sources = ["test/tstlstr.c", "src/lstr#*.c"]
